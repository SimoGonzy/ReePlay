<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Early brand concepts before ReePlay</title>
  <desc id="desc">Branoteca, Datalodia, and Locarmonia: music archives, data, and local music.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08182f"/><stop offset="1" stop-color="#0e2a4d"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#3289ec"/><stop offset="1" stop-color="#104b9f"/></linearGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe0a0"/><stop offset="1" stop-color="#bd8740"/></linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <path d="M0 100H1200M0 438H1200" stroke="#b8965840"/>
  <text x="45" y="49" fill="#f1f7ff" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Your music archive, close at hand</text>
  <text x="45" y="76" fill="#9eb6d2" font-family="Segoe UI,Arial,sans-serif" font-size="13">Early direction: database • music • local — deep blue, white, and gold accents</text>
  <g fill="#0e2440" stroke="#31557c"><rect x="43" y="111" width="350" height="312" rx="21"/><rect x="425" y="111" width="350" height="312" rx="21"/><rect x="807" y="111" width="350" height="312" rx="21"/></g>

  <g transform="translate(144 145)"><rect width="148" height="148" rx="34" fill="url(#blue)"/><ellipse cx="74" cy="51" rx="42" ry="15" fill="none" stroke="#f7fbff" stroke-width="8"/><path d="M32 51v57c0 9 19 16 42 16s42-7 42-16V51M32 80c0 9 19 16 42 16s42-7 42-16" fill="none" stroke="#f7fbff" stroke-width="8"/><path d="M77 72v25l22-5V68z" fill="url(#gold)"/><circle cx="71" cy="101" r="8" fill="url(#gold)"/><circle cx="93" cy="95" r="8" fill="url(#gold)"/></g>
  <text x="218" y="346" fill="#f7fbff" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" letter-spacing="-.8">Branoteca</text>
  <text x="218" y="375" fill="#aabed6" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13">Your collection, always ready</text>
  <text x="218" y="405" fill="#e2bf75" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">ARCHIVE + TRACKS</text>

  <g transform="translate(526 145)"><rect width="148" height="148" rx="34" fill="url(#blue)"/><path d="M29 105V51c0-11 19-20 45-20s45 9 45 20v54c0 11-19 20-45 20s-45-9-45-20z" fill="none" stroke="#f7fbff" stroke-width="8"/><path d="M29 53c0 11 19 20 45 20s45-9 45-20" fill="none" stroke="#f7fbff" stroke-width="8"/><path d="M47 101h11l7-18 10 33 9-24 6 9h11" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="600" y="346" fill="#f7fbff" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" letter-spacing="-.8">Datalodia</text>
  <text x="600" y="375" fill="#aabed6" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13">Data becomes melody</text>
  <text x="600" y="405" fill="#e2bf75" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">DATA + MELODY</text>

  <g transform="translate(908 145)"><rect width="148" height="148" rx="34" fill="url(#blue)"/><path d="M39 53h68M39 73h68M39 93h68" stroke="#f7fbff" stroke-width="7" stroke-linecap="round"/><circle cx="42" cy="53" r="9" fill="url(#gold)"/><circle cx="104" cy="73" r="9" fill="url(#gold)"/><circle cx="59" cy="93" r="9" fill="url(#gold)"/><path d="M42 53c19 0 42 10 62 20M104 73C82 76 70 83 59 93" fill="none" stroke="#d8ad58" stroke-width="3"/></g>
  <text x="982" y="346" fill="#f7fbff" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" letter-spacing="-.8">Locarmonia</text>
  <text x="982" y="375" fill="#aabed6" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13">Harmony on your local network</text>
  <text x="982" y="405" fill="#e2bf75" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">LOCAL + HARMONY</text>
  <text x="45" y="467" fill="#93aac5" font-family="Segoe UI,Arial,sans-serif" font-size="12">Concepts from before ReePlay was chosen. None of these symbols is the app's official logo.</text>
</svg>
